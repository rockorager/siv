# `zig build test` on every push and pull request (D24). Nothing else: the
# integration steps against sway and the desktop daemons, GPU tests,
# performance budgets, frame pacing, and fuzzing run by hand (D24, D25).
#
# The job runs in Arch Linux, whose packages are new enough for every
# `-fsys` option, so it compiles none of the vendored C and C++ libraries
# (D25). Not covered by a system package: SheenBidi, which no distribution
# packages, and wuffs, which has no system library; both are single C
# files. The shaders' SPIR-V is committed, so no shader compiler runs.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container: archlinux:base
    defaults:
      run:
        # As an unprivileged user, like an orb.
        shell: runuser -u ci -- bash -eo pipefail {0}
    env:
      ZIG_VERSION: 0.17.0
      ZIG_SHA256: 1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026
    steps:
      # The libraries siv links, the -fsys ones included; lavapipe
      # (vulkan-swrast) and the validation layer for the Vulkan tests; the
      # keymaps and a font the tests use.
      - name: Packages and the ci user
        shell: bash
        run: |
          pacman -Syu --noconfirm --needed \
            git curl xz tar pkgconf \
            wayland libxkbcommon xkeyboard-config fontconfig ttf-dejavu \
            vulkan-headers vulkan-icd-loader vulkan-swrast vulkan-validation-layers \
            harfbuzz lua lcms2 libwebp libavif dav1d libjxl
          useradd -m -u "$(stat -c %u "$GITHUB_WORKSPACE")" ci
          # D-Bus's Peer.GetMachineId reads it; the image has none.
          systemd-machine-id-setup || tr -d - </proc/sys/kernel/random/uuid >/etc/machine-id

      - uses: actions/checkout@v5

      - name: Zig
        shell: bash
        run: |
          curl -fsSL "https://ziglang.org/download/$ZIG_VERSION/zig-x86_64-linux-$ZIG_VERSION.tar.xz" -o /tmp/zig.tar.xz
          echo "$ZIG_SHA256  /tmp/zig.tar.xz" | sha256sum -c --quiet
          mkdir -p /opt/zig && tar -xJf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
          ln -s /opt/zig/zig /usr/local/bin/zig

      # Fetched packages and Zig's global cache (compiler-rt, libc++, the
      # two vendored C files), once per set of pinned packages.
      - uses: actions/cache@v4
        with:
          path: |
            zig-pkg
            /home/ci/.cache/zig
          key: zig-${{ hashFiles('build.zig.zon') }}

      - name: zig build test
        run: >-
          zig build test -j16 --summary failures
          -fsys=harfbuzz -fsys=lua -fsys=lcms2 -fsys=libwebp -fsys=glslang
          -fsys=libavif -fsys=libjxl
