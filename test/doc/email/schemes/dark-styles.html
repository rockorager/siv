<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  body { margin: 0; padding: 24px; background: #ffffff; color: #1d2433; font-family: Helvetica, Arial, sans-serif }
  .card { background: #f2f4f7; border: 1px solid #d0d5dd; border-radius: 8px; padding: 16px; margin: 16px 0 }
  .muted { color: #667085; font-size: 13px }
  a { color: #1570ef }
  @media (prefers-color-scheme: dark) {
    body { background: #101828 !important; color: #f2f4f7 !important }
    .card { background: #1d2939 !important; border-color: #344054 !important }
    .muted { color: #98a2b3 !important }
    a { color: #53b1fd !important }
  }
</style></head>
<body>
<h2 style="margin: 0 0 8px; font-size: 20px">Your order has shipped</h2>
<p class="muted">Order 4817-2203 · placed October 3</p>
<div class="card"><b>Trail runner, size 42</b><br><span class="muted">Arrives Friday, October 9</span></div>
<p>Track the parcel at <a href="https://shop.example/track/4817">shop.example/track</a>.</p>
</body></html>
